# Runs the project checks on every pull request into dev or main, and after every merge.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Least privilege: the checks only read the code and need no secrets.
permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels that pull request's older run.
  # Pushes to dev and main fall back to the unique run ID, so they always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The job ID is the check name that branch protection requires, so don't rename it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes to git, so the token isn't kept on disk.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check formatting
        run: npm run format:check
