# The whole system: "docker compose up --build" serves the app at http://localhost:8080.
# For local development, "npm run db:up" starts only the db service.

services:
  db:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  # The REST API. It applies database migrations on start, and its health check is in the image.
  # No published port: the browser reaches it only through nginx in the client service.
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Runs a small init process (tini) first. It passes "docker stop" on to the API, and Node is
    # then not the first process, so a stop during start-up is never ignored (no forced kill).
    init: true
    # Set here on purpose: the matching .env values are for local development. Only LOG_LEVEL
    # and the POSTGRES_* values come from .env.
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The address the browser uses (the client service). The CSRF origin check compares
      # the Origin header with it, so change both together.
      CLIENT_ORIGIN: http://localhost:8080
      # The password must be URL-safe (letters, digits, - . _ ~), because it is part of this URL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # nginx: serves the React app and forwards /api to the api service.
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
