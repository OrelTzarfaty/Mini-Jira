# The client container's web server (docs/architecture.md §1). It serves the built React app
# and forwards /api to the API, so the browser sees one origin and the SameSite auth cookie
# works without CORS. Copied over /etc/nginx/conf.d/default.conf by client/Dockerfile.
server {
    # The image runs nginx as a non-root user, which can't bind ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Don't reveal the nginx version in headers and error pages.
    server_tokens off;

    # Redirects (for example /api → /api/) use a path only. Otherwise nginx would put its
    # inside port 8080 in the address, which is wrong when Docker publishes another port.
    absolute_redirect off;

    # Compress text files (HTML is always included when gzip is on).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # The API. No path after the address, so the /api prefix is kept (Express mounts its
    # router at /api). Every request header, including Cookie, Origin, and Sec-Fetch-Site
    # (used by the CSRF origin check), is passed through unchanged.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx adds the client address as the last entry. The API trusts exactly one proxy
        # hop, so it reads only that entry and ignores anything a client put before it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every file name under /assets/, so a changed file gets a new
    # name and browsers can cache these forever. A missing asset is a 404, not index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current asset files, so browsers must check for a new one each time.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any other path (for example /projects/WEB/board) gets index.html, and
    # React Router shows the right screen.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
